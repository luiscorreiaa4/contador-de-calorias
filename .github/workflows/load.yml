name: Load (semanal)

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.8-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
          POSTGRES_DB: contador_calorias_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24.x
          cache: 'npm'
      - name: Install Dependencies
        run: |
          npm ci
          npm --prefix shared ci
          npm --prefix backend ci
      - name: Migrate
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres_test_password
          DB_NAME: contador_calorias_test
          DATABASE_URL: postgres://postgres:postgres_test_password@localhost:5432/contador_calorias_test
          JWT_SECRET: super_secret_test_key_with_at_least_32_chars_123!
          CORS_ORIGIN: http://localhost:5173
          APP_BASE_URL: http://localhost:5173
          MAIL_FROM: CalorieSync <no-reply@caloriesync.local>
          MAIL_TRANSPORT: memory
          AUTH_TOKEN_PEPPER: super_secret_test_pepper_with_at_least_32_chars_456!
          PORT: 3001
        run: npm --prefix backend run migrate up
      - name: Load (p99 máx. 1500 ms)
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres_test_password
          DB_NAME: contador_calorias_test
          DATABASE_URL: postgres://postgres:postgres_test_password@localhost:5432/contador_calorias_test
          JWT_SECRET: super_secret_test_key_with_at_least_32_chars_123!
          CORS_ORIGIN: http://localhost:5173
          APP_BASE_URL: http://localhost:5173
          MAIL_FROM: CalorieSync <no-reply@caloriesync.local>
          MAIL_TRANSPORT: memory
          AUTH_TOKEN_PEPPER: super_secret_test_pepper_with_at_least_32_chars_456!
          PORT: 3001
          DURATION: 30
          CONNECTIONS: 50
          LATENCY_P99_MAX_MS: 1500
        run: npm run test:load
