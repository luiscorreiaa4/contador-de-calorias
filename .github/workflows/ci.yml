name: CI Pipeline

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16.8-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
          POSTGRES_DB: contador_calorias_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm --prefix shared ci
          npm --prefix backend ci
          npm --prefix frontend ci

      - name: Security Audit
        run: |
          npm audit --audit-level=high
          npm --prefix backend audit --audit-level=high
          npm --prefix frontend audit --audit-level=high

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@834a317769a938c4c379a09804e3ab8dd7b89736 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck Shared
        run: npm --prefix shared run typecheck

      - name: Typecheck Backend
        run: npm --prefix backend run typecheck

      - name: Format check
        run: npm run format:check

      - name: Dead code (knip)
        run: npm run knip

      - name: Run Linter
        run: npm run lint

      - name: Run Backend Tests (with DB)
        env:
          PORT: 3000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres_test_password
          DB_NAME: contador_calorias_test
          DATABASE_URL: postgres://postgres:postgres_test_password@localhost:5432/contador_calorias_test
          JWT_SECRET: super_secret_test_key_with_at_least_32_chars_123!
          CORS_ORIGIN: http://localhost:5173
          APP_BASE_URL: http://localhost:5173
          MAIL_FROM: CalorieSync <no-reply@caloriesync.local>
          MAIL_TRANSPORT: memory
          AUTH_TOKEN_PEPPER: super_secret_test_pepper_with_at_least_32_chars_456!
        run: |
          npm --prefix backend run migrate up
          npm run test:strict

      - name: Migration rollback test
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres_test_password@localhost:5432/contador_calorias_test
        run: npm run test:rollback

      - name: Load smoke (sem limite de latência)
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres_test_password
          DB_NAME: contador_calorias_test
          DATABASE_URL: postgres://postgres:postgres_test_password@localhost:5432/contador_calorias_test
          JWT_SECRET: super_secret_test_key_with_at_least_32_chars_123!
          CORS_ORIGIN: http://localhost:5173
          APP_BASE_URL: http://localhost:5173
          MAIL_FROM: CalorieSync <no-reply@caloriesync.local>
          MAIL_TRANSPORT: memory
          AUTH_TOKEN_PEPPER: super_secret_test_pepper_with_at_least_32_chars_456!
          PORT: 3001
          DURATION: 10
        run: npm run test:load

      - name: Run Frontend Tests with Coverage
        run: npm --prefix frontend run test:coverage

      - name: Build Frontend
        run: npm --prefix frontend run build

      - name: Build API Docker image
        run: docker build -t caloriesync-api:ci .
