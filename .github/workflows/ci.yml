name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
          POSTGRES_DB: contador_calorias_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      run: |
        npm ci
        npm --prefix shared ci
        npm --prefix backend ci
        npm --prefix frontend ci

    - name: Security Audit
      run: npm audit --audit-level=high

    - name: Gitleaks Secret Scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Typecheck Shared
      run: npm --prefix shared run typecheck

    - name: Typecheck Backend
      run: npm --prefix backend run typecheck

    - name: Run Linter
      run: npm run lint

    - name: Run Backend Tests (with DB)
      env:
        PORT: 3000
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USER: postgres
        DB_PASSWORD: postgres_test_password
        DB_NAME: contador_calorias_test
        DATABASE_URL: postgres://postgres:postgres_test_password@localhost:5432/contador_calorias_test
        JWT_SECRET: super_secret_test_key_with_at_least_32_chars_123!
        CORS_ORIGIN: http://localhost:5173
      run: |
        npm --prefix backend run migrate up
        npm run test:strict

    - name: Run Frontend Tests with Coverage
      run: npm --prefix frontend run test:coverage

    - name: Build Frontend
      run: npm --prefix frontend run build
